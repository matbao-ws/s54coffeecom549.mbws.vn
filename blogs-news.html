    <!-- Filtering Script -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const filterBtns = document.querySelectorAll('.s54-blog-nav__btn');
        const cards = document.querySelectorAll('.s54-post-card');
        const countLabel = document.getElementById('article-count-label');
        const featuredPost = document.getElementById('featured-post');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                filterBtns.forEach(b => b.classList.remove('is-active'));
                this.classList.add('is-active');

                const filter = this.getAttribute('data-filter');
                let visibleCount = 0;

                cards.forEach(card => {
                    const cat = card.getAttribute('data-category');
                    if (filter === 'all' || cat === filter) {
                        card.style.display = 'flex';
                        visibleCount++;
                    } else {
                        card.style.display = 'none';
                    }
                });

                if (countLabel) {
                    countLabel.textContent = visibleCount + ' Bài Viết';
                }
            });
        });
    });
    </script>

<!-- S54 Luxury Back-To-Top Floating Button -->
<button type="button" class="s54-back-to-top" id="s54-back-to-top" aria-label="Cuộn về đầu trang">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</button>
<script>
(function() {
  var btn = document.getElementById('s54-back-to-top');
  if (!btn) return;
  function toggleBTT() {
    if (window.pageYOffset > 320) {
      btn.classList.add('is-visible');
    } else {
      btn.classList.remove('is-visible');
    }
  }
  window.addEventListener('scroll', toggleBTT, { passive: true });
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  toggleBTT();
})();
</script>
