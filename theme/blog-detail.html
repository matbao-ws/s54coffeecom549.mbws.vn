fee là tập thể những con người trẻ tuổi, đầy nhiệt huyết và cùng chung niềm đam mê cháy bỏng với cà phê Việt. Sự tận tâm và tinh thần sáng tạo không ngừng của đội ngũ chính là động lực lớn nhất giúp thương hiệu phát triển.", "img_url": "https://drive.google.com/file/d/10P2mAsAXXTCER7fwFq_DtRuOfKkfo8Ko/view?usp=drive_link", "sub_img": "https://www.youtube.com/watch?v=ZjBMQT0EmUI", "note": "Bài viết giới thiệu nhân sự, văn hóa doanh nghiệp và tinh thần con người S54.", "slug": "gap_go_oi_ngu_s54_coffee", "base_filename": "news_15_gap_go_oi_ngu_s54_coffee", "local_image": "assets/images/s54/news/news_15_gap_go_oi_ngu_s54_coffee.webp", "date": "15/07/2026", "read_time": "3 phút đọc", "cat_slug": "blog", "cat_display": "Câu Chuyện S54"}, {"id": "16", "title": "Lý do chúng tôi bắt đầu hành trình này", "category": "Blog", "content": "Hành trình của S54 Coffee bắt đầu từ mong muốn nâng cao giá trị hạt cà phê Robusta Việt Nam và mang lại nguồn thu nhập tốt hơn cho người trồng. Chúng tôi tin rằng một tách cà phê chất lượng không chỉ làm tỉnh táo trí óc mà còn nâng tầm giá trị lao động Việt.", "img_url": "https://drive.google.com/file/d/1xg0fVUHGLwvQ1Kofby6lWS0W3PmLAiRQ/view?usp=drive_link", "sub_img": "https://www.youtube.com/watch?v=AHEC0eUB-WY", "note": "Câu chuyện khởi nghiệp chia sẻ động lực thành lập và trăn trở với nông sản Việt.", "slug": "ly_do_chung_toi_bat_au_hanh_trinh_nay", "base_filename": "news_16_ly_do_chung_toi_bat_au_hanh_trinh_nay", "local_image": "assets/images/s54/news/news_16_ly_do_chung_toi_bat_au_hanh_trinh_nay.webp", "date": "10/07/2026", "read_time": "3 phút đọc", "cat_slug": "blog", "cat_display": "Câu Chuyện S54"}, {"id": "17", "title": "Một ngày làm việc tại S54 Coffee", "category": "Blog", "content": "Mỗi ngày tại S54 Coffee đều bắt đầu bằng hương thơm cà phê nồng nàn, sự tập trung cao độ trong khâu kiểm định và không khí làm việc tràn đầy năng lượng. Chúng tôi tỉ mỉ trong từng công đoạn nhỏ để đảm bảo từng sản phẩm ra thị trường đều đạt độ hoàn h         const readTime = document.getElementById('article-read-time');
        if (readTime) readTime.textContent = art.read_time;

        const img = document.getElementById('article-img');
        if (img) {
            img.src = art.local_image || 'assets/images/s54/blog_cup.jpg';
            img.alt = art.title;
        }

        // Format Body Content
        const lead = document.getElementById('article-lead');
        if (lead) lead.textContent = art.content;

        const contentBody = document.getElementById('article-content-body');
        if (contentBody && art.id !== '1') {
            let paragraphs = [
                art.content,
                "Tại S54 Coffee, chúng tôi luôn chú trọng từng công đoạn từ tuyển chọn hạt cà phê chín mọng, rang mộc theo tiêu chuẩn khắt khe, đến đóng gói bảo quản để mang lại tách cà phê đậm vị tinh tế nhất đến tay người tiêu dùng.",
                "Sứ mệnh của S54 không chỉ dừng lại ở chất lượng tách cà phê mỗi sáng, mà còn là cam kết đồng hành lâu dài cùng cộng đồng nông dân Tây Nguyên, nâng cao giá trị chuỗi cung ứng và hiện thực hóa triết lý 'New Coffee, New Income'."
            ];

            let htmlStr = '';
            paragraphs.forEach((p, idx) => {
                if (idx === 1) {
                    htmlStr += '<div class="s54-article-quote">"Mỗi tách cà phê S54 là kết tinh của tình yêu đất trời Tây Nguyên và khát vọng phụng sự cộng đồng."</div>';
                    htmlStr += '<h2>Đồng Hành Cùng Chất Lượng & Sinh Kế Bền Vững</h2>';
                }
                htmlStr += '<p>' + p + '</p>';
            });
            contentBody.innerHTML = htmlStr;
        }

        // Render Related Articles (pick 3 other articles)
        const relatedGrid = document.getElementById('related-grid');
        if (relatedGrid) {
            const others = S54_ARTICLES.filter(a => String(a.id) !== String(art.id));
            const related = others.slice(0, 3);
            let relatedHtml = '';
            related.forEach(rel => {
                const rImg = rel.local_image || 'assets/images/s54/blog_cup.jpg';
                relatedHtml += `
                    <a href="blog-detail.html?id=${rel.id}" class="s54-related-card">
                        <img src="${rImg}" alt="${rel.title}" loading="lazy" />
                        <div class="s54-related-card__content">
                            <div class="s54-post-meta" style="margin-bottom: 6px;">
                                <span>${rel.date}</span>
                                <span>•</span>
                                <span>${rel.read_time}</span>
                            </div>
                            <h4 class="s54-related-card__title">${rel.title}</h4>
                        </div>
                    </a>
                `;
            });
            relatedGrid.innerHTML = relatedHtml;
        }
    });
    </script>

<!-- S54 Luxury Back-To-Top Floating Button -->
<button type="button" class="s54-back-to-top" id="s54-back-to-top" aria-label="Cuộn về đầu trang">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</button>
<script>
(function() {
  var btn = document.getElementById('s54-back-to-top');
  if (!btn) return;
  function toggleBTT() {
    if (window.pageYOffset > 320) {
      btn.classList.add('is-visible');
    } else {
      btn.classList.remove('is-visible');
    }
  }
  window.addEventListener('scroll', toggleBTT, { passive: true });
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  toggleBTT();
})();
</script>
