    <script>
    function renderCheckoutSummary() {
        const cart = window.S54Cart ? window.S54Cart.getCart() : { items: [], total_price: 0 };
        const items = cart.items || [];
        const container = document.getElementById('checkout-items-list');
        const countEl = document.getElementById('summary-items-count');
        const freeshipNotice = document.getElementById('freeship-notice-wrap');
        let subtotal = 0;
        let totalItems = 0;

        if (items.length === 0) {
            container.innerHTML = '<p style="color: #7A6D65; text-align: center; padding: 24px 0;">Giỏ hàng của bạn đang trống. <a href="collections-coffee.html" style="color: #D68E1D; font-weight: 600;">Tiếp tục mua sắm</a></p>';
            if (countEl) countEl.textContent = '(0 sản phẩm)';
            if (freeshipNotice) freeshipNotice.innerHTML = '';
            document.getElementById('summary-subtotal').textContent = '0₫';
            document.getElementById('summary-total').textContent = '0₫';
            return;
        }

        let html = '';
        items.forEach(item => {
            let price = typeof item.price === 'number' ? item.price : parseInt(String(item.price).replace(/\./g, '').replace(/[^0-9]/g, ''), 10);
            if (isNaN(price) || price <= 0) price = 35000;
            if (price > 10000000) {
                const knownPrices = [15000, 35000, 65000, 119000, 199000, 150000, 225000, 250000, 350000, 646000, 702000, 720000, 805000];
                for (let kp of knownPrices) {
                    if (String(price).startsWith(String(kp))) { price = kp; break; }
                }
                if (price > 10000000) price = 35000;
            }
            if (price === 3500) price = 35000;
            if (price === 1500) price = 15000;
            if (price === 6500) price = 65000;
            const qty = item.quantity || 1;
            totalItems += qty;
            const linePrice = price * qty;
            subtotal += linePrice;
            html += `
                <div class="s54-order-item">
                    <img src="${item.image || 'assets/images/s54/products/tui_3in1_456g.jpg'}" alt="${item.title}" />
                    <div class="s54-order-item-info">
                        <h4 class="s54-order-item-title">${item.title}</h4>
                        <div class="s54-order-item-qty">Số lượng: ${qty}</div>
                    </div>
                    <div class="s54-order-item-price">${linePrice.toLocaleString('vi-VN')}₫</div>
                </div>
            `;
        });
        container.innerHTML = html;
        if (countEl) countEl.textContent = `(${totalItems} sản phẩm)`;

        const shipping = subtotal >= 599000 ? 0 : 30000;
        if (freeshipNotice) {
            if (subtotal >= 599000) {
                freeshipNotice.innerHTML = `
                    <div class="s54-freeship-banner" style="background:#EBF7EE; border-color:rgba(46,125,50,0.25); color:#1B5E20; display:flex; align-items:center; gap:8px;">
                        <span style="font-size:16px;">🎉</span>
                        <span>Đơn hàng của bạn đủ điều kiện <strong>Miễn phí vận chuyển toàn quốc</strong>!</span>
                    </div>`;
            } else {
                const diff = 599000 - subtotal;
                freeshipNotice.innerHTML = `
                    <div class="s54-freeship-banner" style="display:flex; align-items:center; gap:8px;">
                        <span style="font-size:16px;">🚚</span>
                        <span>Mua thêm <strong>${diff.toLocaleString('vi-VN')}₫</strong> để được <strong>Miễn phí vận chuyển</strong>.</span>
                    </div>`;
            }
        }

        document.getElementById('summary-subtotal').textContent = subtotal.toLocaleString('vi-VN') + '₫';
        document.getElementById('summary-shipping').textContent = shipping === 0 ? 'Miễn phí' : '30.000₫';
        document.getElementById('summary-total').textContent = (subtotal + shipping).toLocaleString('vi-VN') + '₫';
    }

    function initPaymentOptions() {
        const payOptions = document.querySelectorAll('.s54-pay-option');
        payOptions.forEach(opt => {
            opt.addEventListener('click', function() {
                payOptions.forEach(o => o.classList.remove('is-selected'));
                this.classList.add('is-selected');
                const radio = this.querySelector('input[type="radio"]');
                if (radio) radio.checked = true;
            });
        });
    }

    function handlePlaceOrder() {
        const name = document.getElementById('cust-name').value;
        const phone = document.getElementById('cust-phone').value;
        const orderId = 'S54-' + Math.floor(100000 + Math.random() * 900000);
        
        alert('Chúc mừng Quý khách ' + name + '!\n\nĐơn hàng #' + orderId + ' đã được ghi nhận thành công.\nChuyên viên S54 Coffee sẽ liên hệ số điện thoại ' + phone + ' để xác nhận và gửi hàng sớm nhất.');
        
        if (window.S54Cart) window.S54Cart.clear();
        window.location.href = 'index.html';
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderCheckoutSummary();
        initPaymentOptions();
    });
    </script>

<button type="button" class="s54-back-to-top" id="s54-back-to-top" aria-label="Cuộn về đầu trang">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</button>
<script>
(function() {
  var btn = document.getElementById('s54-back-to-top');
  if (!btn) return;
  function toggleBTT() {
    if (window.pageYOffset > 320) {
      btn.classList.add('is-visible');
    } else {
      btn.classList.remove('is-visible');
    }
  }
  window.addEventListener('scroll', toggleBTT, { passive: true });
  btn.addEventListener('click', function(e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  toggleBTT();
})();
</script>
